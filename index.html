<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa obrazu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 40px;
        }
        h1 {
            color: #333;
        }
        .container {
            display: inline-block;
            border: 3px solid #007BFF;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-color: #fff;
        }
        img {
            display: block;
        }
    </style>
</head>
<body>

    <h1>Mapa obrazu</h1>

    <div class="container">
        <img src="zs2.png" alt="Tarcza Perspektywy ZS2" usemap="#mapa">

        <map name="mapa">
            <area target="_blank" alt="Zespół Szkół nr 2 w Stargardzie" title="Strona główna ZS2" href="https://zs2.stargard.pl" coords="196,36,274,77,322,77,315,216,338,225,326,267,336,287,305,274,274,312,196,358,118,312,87,274,50,287,66,253,54,212,77,216,66,77,118,77" shape="poly">
        </map>
    </div>

</body>
</html>
